  <line x1="27" y1="52" x2="27" y2="57" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="27" y1="52" x2="30" y2="57" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="52" x2="34" y2="57" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="52" x2="37" y2="57" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="52" x2="40" y2="57" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
